<!DOCTYPE html>
<html lang="ru" class="dark widget">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TimeTool — виджет</title>
    <base href="./" />
    <link rel="stylesheet" href="css/app.css" />
    <script src="js/app.js"></script>
    <script>
        // Тема до отрисовки
        (function () {
            var t = null;
            try { t = localStorage.getItem("timetool-theme"); } catch (e) { }
            if (t !== "dark" && t !== "light") t = "dark";
            document.documentElement.classList.toggle("dark", t === "dark");
        })();
        // window.__widget (какая вкладка) задаётся скриптом, внедрённым хостом до создания документа
    </script>
</head>

<body>
    <div id="app">
        <div class="loading-screen">
            <div class="spinner"></div>
            <div>Загрузка виджета…</div>
        </div>
    </div>
    <script src="_framework/blazor.webview.js"></script>
</body>

</html>
