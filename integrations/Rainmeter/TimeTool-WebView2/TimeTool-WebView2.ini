; TimeTool — виджет для Rainmeter через плагин WebView2
; Плагин: https://github.com/NSTechBytes/WebView2 (см. релизы, положить WebView2.dll в папку скина
;          или в @Resources\Plugins). Без плагина используйте соседний скин TimeTool-WebParser.
; Показывает живую страницу TimeTool — отсчёты обновляются сами, каждую секунду.

[Rainmeter]
Update=1000
BackgroundMode=2
SolidColor=0,0,0,1
AccurateText=1

[Metadata]
Name=TimeTool — отсчёты (WebView2)
Author=TimeTool
Information=Встраивает страницу TimeTool (http://127.0.0.1:47777) в скин. Требует плагин WebView2 и запущенный TimeTool.
Version=1.0
License=MIT

[Variables]
W=300
H=180

[MeasureWebView]
Measure=Plugin
Plugin=WebView2
URL=http://127.0.0.1:47777/
Width=#W#
Height=#H#
Transparent=1
DisableContextMenu=1
DisableDevTools=1
Continuous=1

[MeterWebView]
Meter=String
MeasureName=MeasureWebView
X=0
Y=0
W=#W#
H=#H#
SolidColor=13,17,23,220
AntiAlias=1
