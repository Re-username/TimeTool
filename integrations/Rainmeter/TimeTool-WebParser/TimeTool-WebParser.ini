; TimeTool - виджет для Rainmeter (без сторонних плагинов)
; Требует запущенный TimeTool (в т.ч. в трее) - данные берутся с http://127.0.0.1:47777/events.txt
; Установка: скопируйте папку TimeTool-WebParser в Documents\Rainmeter\Skins, обновите скины (Manage → Refresh All).

[Rainmeter]
Update=1000
BackgroundMode=2
SolidColor=0,0,0,180
AccurateText=1

[Metadata]
Name=TimeTool - отсчёты (WebParser)
Author=TimeTool
Information=Показывает ближайшие события из приложения TimeTool. Требует запущенный TimeTool.
Version=1.0
License=MIT

[Variables]
Font=Segoe UI

; --- мера: забирает список событий ---
; Формат строки: имя|дд.мм.гггг чч:мм|осталось
[MeasureEvents]
Measure=WebParser
URL=http://127.0.0.1:47777/events.txt
RegExp=(?siU)^(.*)\|(.*)\|(.*)$\n^(.*)\|(.*)\|(.*)$\n^(.*)\|(.*)\|(.*)$\n^(.*)\|(.*)\|(.*)$\n^(.*)\|(.*)\|(.*)$
FinishAction=[!UpdateMeter *][!Redraw]
OnConnectErrorAction=[!SetOption MeterTitle Text "TimeTool не запущен"]
Debug=2

; Событие 1
[MeasureN1]
Measure=WebParser
URL=[MeasureEvents]
StringIndex=1
[MeasureD1]
Measure=WebParser
URL=[MeasureEvents]
StringIndex=2
[MeasureL1]
Measure=WebParser
URL=[MeasureEvents]
StringIndex=3

; Событие 2
[MeasureN2]
Measure=WebParser
URL=[MeasureEvents]
StringIndex=4
[MeasureD2]
Measure=WebParser
URL=[MeasureEvents]
StringIndex=5
[MeasureL2]
Measure=WebParser
URL=[MeasureEvents]
StringIndex=6

; Событие 3
[MeasureN3]
Measure=WebParser
URL=[MeasureEvents]
StringIndex=7
[MeasureD3]
Measure=WebParser
URL=[MeasureEvents]
StringIndex=8
[MeasureL3]
Measure=WebParser
URL=[MeasureEvents]
StringIndex=9

; Событие 4
[MeasureN4]
Measure=WebParser
URL=[MeasureEvents]
StringIndex=10
[MeasureD4]
Measure=WebParser
URL=[MeasureEvents]
StringIndex=11
[MeasureL4]
Measure=WebParser
URL=[MeasureEvents]
StringIndex=12

; --- отрисовка ---
[MeterTitle]
Meter=String
X=10
Y=8
FontFace=#Font#
FontSize=11
FontColor=88,166,255,255
AntiAlias=1
Text="TimeTool"

[MeterEvent1]
Meter=String
MeasureName=MeasureN1
MeasureName2=MeasureL1
X=10
Y=32
FontFace=#Font#
FontSize=10
FontColor=230,237,243,255
AntiAlias=1
Text="%1 - %2"
ClipString=1
W=250

