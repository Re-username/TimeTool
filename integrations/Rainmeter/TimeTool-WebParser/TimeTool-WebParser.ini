; TimeTool - виджет для Rainmeter (без сторонних плагинов)
; Требует запущенный TimeTool (в т.ч. в трее) - данные: http://127.0.0.1:47777/timer.txt и /events.txt
; Установка: скопируйте папку TimeTool-WebParser в Documents\Rainmeter\Skins, обновите скины (Manage - Refresh All).

[Rainmeter]
Update=1000
BackgroundMode=2
SolidColor=0,0,0,180
AccurateText=1

[Metadata]
Name=TimeTool - отсчёты и таймер (WebParser)
Author=TimeTool
Information=Показывает таймер и ближайшие события из приложения TimeTool. Требует запущенный TimeTool.
Version=1.1
License=MIT

[Variables]
Font=Segoe UI

; ======================= МЕРЫ =======================

; Таймер: строка «Таймер|чч:мм:сс»
[MeasureTimerValue]
Measure=WebParser
URL=http://127.0.0.1:47777/timer.txt
; якорь $ обязателен: без него ленивая (.*) второй группы матчит ПУСТО (префикс «...|»)
RegExp=(?siU)(.*)\|(.*)$
StringIndex=2
OnConnectErrorAction=[!SetOption MeterTimer Text "Таймер: нет связи"]

; События: строки «имя|дд.мм.гггг чч:мм|осталось» (до 4)
; (?si) + ленивые поля, но БЕЗ (?U): (?U) сделал бы ленивыми и «?» групп-строк — те предпочли бы
; не матчиться и заполнялась бы только первая строка. Жадные ? на группах строк — лечение.
[MeasureEvents]
Measure=WebParser
URL=http://127.0.0.1:47777/events.txt
RegExp=(?si)(.*?)\|(.*?)\|(.*?)\n(?:(.*?)\|(.*?)\|(.*?)\n)?(?:(.*?)\|(.*?)\|(.*?)\n)?(?:(.*?)\|(.*?)\|(.*?)\n)?(?:(.*?)\|(.*?)\|(.*?)\n?)?
FinishAction=[!UpdateMeter *][!Redraw]
OnConnectErrorAction=[!SetOption MeterTitle Text "TimeTool не запущен"]

[MeasureN1]
Measure=WebParser
URL=[MeasureEvents]
StringIndex=1
IfMatch=^$
IfMatchAction=[!SetOption MeterTitle Text "Событий нет (добавьте в TimeTool)"]
IfNotMatchAction=[!SetOption MeterTitle Text "TimeTool"]
[MeasureD1]
Measure=WebParser
URL=[MeasureEvents]
StringIndex=2
[MeasureL1]
Measure=WebParser
URL=[MeasureEvents]
StringIndex=3

[MeasureN2]
Measure=WebParser
URL=[MeasureEvents]
StringIndex=4
[MeasureD2]
Measure=WebParser
URL=[MeasureEvents]
StringIndex=5
[MeasureL2]
Measure=WebParser
URL=[MeasureEvents]
StringIndex=6

[MeasureN3]
Measure=WebParser
URL=[MeasureEvents]
StringIndex=7
[MeasureD3]
Measure=WebParser
URL=[MeasureEvents]
StringIndex=8
[MeasureL3]
Measure=WebParser
URL=[MeasureEvents]
StringIndex=9

[MeasureN4]
Measure=WebParser
URL=[MeasureEvents]
StringIndex=10
[MeasureD4]
Measure=WebParser
URL=[MeasureEvents]
StringIndex=11
[MeasureL4]
Measure=WebParser
URL=[MeasureEvents]
StringIndex=12

; ======================= МЕТРЫ =======================

[MeterTitle]
Meter=String
X=10
Y=8
FontFace=#Font#
FontSize=11
FontColor=88,166,255,255
AntiAlias=1
Text="TimeTool"

[MeterTimer]
Meter=String
